<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Infinite Canvas</title>
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.07.29.1785819149">
    <link rel="stylesheet" href="/static/css/studio-shell.css?v=2026.07.29.1786080775">
    <script>
        try {
            if((localStorage.getItem('studio_theme') || 'dark') === 'dark') document.documentElement.classList.add('theme-dark','studio-theme-dark');
        } catch(e) {}
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.07.29.1785819149"></script>
    <script src="/static/js/i18n.js?v=2026.07.29.1786605608"></script>
    <script src="/static/js/site-announcement.js?v=2026.07.29.1785824150"></script>
</head>
<body>
    <main id="studioShell" class="studio-shell">
        <iframe id="workbenchFrame" class="studio-workbench" src="/static/canvas-list.html?v=2026.07.29.1786607215" title="项目工作台"></iframe>

        <div id="settingsBackdrop" class="studio-popover-backdrop"></div>
        <section id="settingsPopover" class="studio-settings-popover" role="dialog" aria-label="设置中心">
            <header>
                <div>
                    <strong id="settingsUserName">Infinite Canvas</strong>
                    <span id="settingsUserMeta">本地创作工作台</span>
                </div>
                <div id="settingsAvatar" class="studio-avatar">IC</div>
            </header>
            <div class="studio-settings-grid">
                <button data-action="account"><i data-lucide="user-round"></i><span>我的账户</span></button>
                <button data-action="assets"><i data-lucide="library-big"></i><span>资产库</span></button>
                <button id="apiSettingsEntry" data-action="api-settings" hidden><i data-lucide="link-2"></i><span>模型与 API</span></button>
                <button id="adminEntry" data-action="admin" hidden><i data-lucide="shield-check"></i><span>系统管理</span></button>
                <button id="themeAction" data-action="theme">
                    <i class="studio-theme-icon studio-theme-icon-moon" data-lucide="moon" aria-hidden="true"></i>
                    <i class="studio-theme-icon studio-theme-icon-sun" data-lucide="sun" aria-hidden="true"></i>
                    <span id="themeActionLabel" class="studio-preference-pair">
                        <span id="themeCurrentMode" class="is-active">深色</span>
                        <span class="studio-preference-separator" aria-hidden="true">/</span>
                        <span id="themeOtherMode">浅色</span>
                    </span>
                </button>
                <button id="languageAction" data-action="language">
                    <i data-lucide="languages"></i>
                    <span class="studio-preference-pair">
                        <span id="languageCurrentMode" class="is-active">中文</span>
                        <span class="studio-preference-separator" aria-hidden="true">/</span>
                        <span id="languageOtherMode">English</span>
                    </span>
                </button>
                <button data-action="announcement"><i data-lucide="megaphone"></i><span>系统公告</span></button>
                <button data-action="github"><i data-lucide="github"></i><span>GitHub 仓库</span></button>
            </div>
            <button id="versionButton" class="studio-version-row" data-action="update">
                <span><i data-lucide="refresh-cw"></i><b id="versionText">正在读取版本…</b></span>
                <small id="updateStatus">检测更新</small>
            </button>
            <button class="studio-logout" data-action="logout"><i data-lucide="log-out"></i><span>退出登录</span></button>
        </section>

        <section id="accountCard" class="studio-account-card" role="dialog" aria-modal="true" aria-label="账户信息">
            <button id="accountClose" type="button" aria-label="关闭"><i data-lucide="x"></i></button>
            <div id="accountAvatar" class="studio-avatar large">IC</div>
            <h2 id="accountName">用户</h2>
            <p id="accountUsername">@user</p>
            <dl>
                <div><dt>真实姓名</dt><dd id="accountRealName">—</dd></div>
                <div><dt>部门</dt><dd id="accountDepartment">—</dd></div>
                <div><dt>角色</dt><dd id="accountRole">—</dd></div>
                <div><dt>API 配置组</dt><dd id="accountProfile">—</dd></div>
            </dl>
        </section>

        <section id="panelOverlay" class="studio-panel-overlay" aria-hidden="true">
            <header>
                <button id="panelClose" type="button"><i data-lucide="arrow-left"></i><span>返回工作台</span></button>
                <strong id="panelTitle">设置</strong>
            </header>
            <div id="panelFrameHost" class="studio-panel-frame-host" aria-live="polite"></div>
        </section>
    </main>
    <script src="/static/js/studio-shell.js?v=2026.07.29.1786605608"></script>
</body>
</html>
