<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>项目工作台</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'dark') document.documentElement.classList.add('studio-theme-dark', 'theme-dark');
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.07.29.1785819149"></script>
    <script src="/static/js/theme.js?v=2026.07.29.1785819149"></script>
    <script src="/static/js/touch-mouse.js?v=2026.07.29.1785819149"></script>
    <script src="/static/js/i18n.js?v=2026.07.29.1786416506"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.07.29.1785819149">
    <link rel="stylesheet" href="/static/css/canvas-list.css?v=2026.07.29.1786080775">
</head>
<body>
    <div id="workspace" class="workspace">
        <button id="mobileProjectToggle" class="ws-mobile-project-toggle" type="button" aria-label="打开项目列表">
            <i data-lucide="panel-left"></i>
        </button>
        <button id="mobileSidebarBackdrop" class="ws-sidebar-backdrop" type="button" aria-label="关闭项目列表"></button>
        <aside id="sidebar" class="ws-sidebar">
            <div class="ws-side-head">
                <div class="ws-side-title">项目</div>
                <div class="ws-side-head-actions">
                    <button id="newProjectBtn" class="ws-side-add" type="button" title="新建项目" aria-label="新建项目"><i data-lucide="plus"></i></button>
                    <button id="mobileSidebarClose" class="ws-mobile-close" type="button" aria-label="收起项目列表"><i data-lucide="panel-left-close"></i></button>
                </div>
            </div>
            <div id="newProjectRow" class="ws-newproj-row">
                <input id="newProjectInput" class="ws-newproj-input" type="text" maxlength="60" placeholder="项目名称">
                <button id="newProjectConfirm" class="ws-mini-btn primary" type="button" aria-label="确定"><i data-lucide="check"></i></button>
                <button id="newProjectCancel" class="ws-mini-btn" type="button" aria-label="取消"><i data-lucide="x"></i></button>
            </div>
            <div id="projectList" class="ws-project-list"></div>
            <div class="ws-side-foot">
                <button id="trashEntry" class="ws-trash-entry" type="button">
                    <i data-lucide="trash-2"></i><span class="ws-trash-label">回收站</span><span id="trashBadge" class="ws-trash-badge">0</span>
                </button>
                <button id="studioSettingsBtn" class="ws-trash-entry ws-settings-entry" type="button">
                    <i data-lucide="settings-2"></i><span class="ws-trash-label">设置中心</span>
                </button>
            </div>
        </aside>

        <main class="ws-main">
            <header class="ws-topbar">
                <div class="ws-topbar-left">
                    <div id="boardProjectName" class="ws-board-name">默认项目</div>
                    <span id="boardCanvasCount" class="ws-board-count">0</span>
                </div>
                <div class="ws-topbar-right">
                    <button id="pasteCanvasBtn" class="ws-paste-btn" type="button" style="display:none"><i data-lucide="clipboard-paste"></i><span>粘贴到此项目</span></button>
                    <div id="canvasSearchWrap" class="ws-search-wrap">
                        <button id="canvasSearchToggle" class="ws-icon-btn" type="button" aria-label="搜索画布"><i data-lucide="search"></i></button>
                        <input id="canvasSearchInput" type="search" placeholder="搜索当前项目">
                    </div>
                    <button id="boardRefresh" class="ws-icon-btn" type="button" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw"></i></button>
                </div>
            </header>

            <div id="board" class="ws-board">
                <div id="boardWorld" class="ws-board-world"></div>
                <div id="boardEmptyHint" class="ws-board-empty hidden"></div>
            </div>

            <section id="trashPanel" class="ws-trash-panel">
                <div class="ws-trash-head">
                    <div class="ws-trash-head-title"><i data-lucide="trash-2"></i><span>回收站</span></div>
                    <button id="trashClose" class="ws-icon-btn" type="button" aria-label="关闭"><i data-lucide="x"></i></button>
                </div>
                <div class="ws-trash-note"><i data-lucide="info"></i><span>回收站中的画布会在 30 天后自动清理。</span></div>
                <div id="trashList" class="ws-trash-list"></div>
            </section>
            <div id="boardStatus" class="ws-status"></div>
        </main>
    </div>
    <script src="/static/js/canvas-list.js?v=2026.07.29.1786080775"></script>
</body>
</html>
