<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>资产库</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.07.29.1783969806"></script>
    <script src="/static/js/theme.js?v=2026.07.29.1783969806"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.07.29.1783969806">
    <link rel="stylesheet" href="/static/css/library-shared.css?v=2026.07.29.1786292093">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background: var(--panel); }
        .library-standalone-bar {
            position: relative;
            z-index: 210;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }
        .library-standalone-back {
            height: 36px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--soft);
            color: var(--text);
            font-size: 13px;
            font-weight: 750;
            cursor: pointer;
        }
        .library-standalone-back svg { width: 15px; height: 15px; }
        .library-standalone-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
        }
        .library-standalone .library-modal-overlay {
            display: flex;
            position: absolute;
            z-index: 200;
        }
        .library-standalone .library-modal {
            width: calc(100vw - 128px);
            height: calc(100vh - 120px);
        }
        .library-standalone-bar { display: none; }
        .library-standalone-bar[hidden] { display: none !important; }
        .library-standalone .library-modal { height: calc(100vh - 128px); }
        html.library-direct .library-standalone-bar { display: flex; }
        html.library-direct .library-standalone .library-modal { height: calc(100vh - 120px); }
    </style>
</head>
<body class="library-standalone">
    <div class="library-standalone-bar" id="libraryStandaloneBar">
        <button class="library-standalone-back" type="button" id="libraryBackBtn">
            <i data-lucide="arrow-left"></i><span>返回工作台</span>
        </button>
        <div class="library-standalone-title">资产库</div>
    </div>

    <div id="assets-library-overlay" class="library-modal-overlay open">
        <div id="assets-library-modal" class="library-modal">
            <div class="library-header">
                <div class="library-header-left">
                    <div class="library-tabs">
                        <button class="library-tab active" data-tab="myAssets">
                            <i data-lucide="folder"></i>
                            <span>我的资产</span>
                        </button>
                        <button class="library-tab" data-tab="material">
                            <i data-lucide="image"></i>
                            <span>素材库</span>
                        </button>
                        <button class="library-tab" data-tab="avatar">
                            <i data-lucide="user"></i>
                            <span>虚拟人像库</span>
                        </button>
                    </div>
                </div>
                <div class="library-header-right">
                    <div class="library-search">
                        <i data-lucide="search"></i>
                        <input type="search" placeholder="搜索素材..." aria-label="搜索素材">
                        <button class="library-search-clear" type="button">
                            <i data-lucide="x"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="library-categories"></div>
            <div class="library-toolbar"></div>
            <div class="library-content"></div>
        </div>
    </div>

    <script src="/static/js/i18n.js?v=2026.07.29.1786550167"></script>
    <script src="/static/js/library-shared.js?v=2026.07.29.1786289963"></script>
    <script src="/static/js/asset-library.js?v=2026.07.29.1786291936"></script>
    <script>
        if(window.self === window.top) {
            document.documentElement.classList.add('library-direct');
            document.getElementById('libraryStandaloneBar').removeAttribute('hidden');
        }
        document.getElementById('libraryBackBtn').addEventListener('click', () => {
            try {
                parent.postMessage({type:'studio:close-panel'}, location.origin);
            } catch(e) {}
            if(window.self !== window.top) return;
            setTimeout(() => { if(window.history.length > 1) history.back(); else location.href = '/'; }, 80);
        });
    </script>
</body>
</html>
