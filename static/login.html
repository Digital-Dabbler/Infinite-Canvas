<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Infinite Canvas · 登录</title>
  <script>
    (function(){
      try {
        var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
        if(theme === 'dark') document.documentElement.classList.add('theme-dark','studio-theme-dark');
      } catch(e) {}
    })();
  </script>
  <script src="/static/js/theme.js?v=2026.07.29.1783969806"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ui-bg-canvas);color:var(--ui-text);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}.card{width:min(420px,calc(100vw - 32px));padding:30px;border:1px solid var(--ui-border);border-radius:18px;background:var(--ui-surface-raised);box-shadow:0 24px 70px var(--ui-shadow)}h1{margin:0 0 6px;font-size:25px}p{color:var(--ui-text-muted);margin:0 0 22px}label{display:block;margin:12px 0 5px}input,select{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--ui-border);background:var(--ui-surface-sunken);color:inherit;font:inherit}input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ui-focus-ring);outline-offset:2px}select:disabled{color:var(--ui-text-disabled)}button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--ui-brand);color:var(--ui-on-brand);font-weight:700;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.link{background:transparent;color:var(--ui-text-muted);margin-top:8px}.form[hidden]{display:none}.form-actions{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.form-actions .link{width:auto;margin:0;padding:6px 0;text-align:left;font-size:13px;font-weight:600}.form-actions .link:last-child{text-align:right}#message{min-height:22px;margin-top:14px;color:var(--ui-danger)}.hint{font-size:12px;color:var(--ui-text-muted)}.reset-note{margin:4px 0 14px;font-size:12px;color:var(--ui-text-muted)}
  </style>
  <link rel="stylesheet" href="/static/css/studio-theme-tokens.css">
</head>
<body><main class="card">
  <h1>Infinite Canvas</h1><p id="subtitle">请登录后使用公司局域网创作服务</p>
  <form id="loginForm" class="form"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><div class="form-actions"><button class="link" type="button" id="showRegister">没有账号？注册</button><button class="link" type="button" id="showReset">忘记密码？</button></div></form>
  <form id="registerForm" class="form" hidden><label>姓名<input name="name" autocomplete="name" required></label><label>部门<select id="registerDepartment" name="department" required><option value="">正在加载部门…</option></select></label><label>账号<input name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]{3,40}" title="账号只能使用 3-40 位字母、数字、点、下划线或连字符，不能使用邮箱" required></label><label>密码<input name="password" type="password" autocomplete="new-password" minlength="10" required></label><button id="registerSubmit">注册</button><button class="link" type="button" id="showLogin">返回登录</button></form>
  <form id="resetForm" class="form" hidden><div class="reset-note">请填写注册时使用的姓名和部门进行身份核验。管理员账号请联系系统管理员处理。</div><label>账号<input name="username" autocomplete="username" minlength="3" required></label><label>姓名<input name="name" autocomplete="name" required></label><label>部门<select id="resetDepartment" name="department" required><option value="">正在加载部门…</option></select></label><label>新密码<input name="new_password" type="password" autocomplete="new-password" minlength="10" required></label><label>确认新密码<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></label><button id="resetSubmit">重置密码</button><button class="link" type="button" id="showLoginFromReset">返回登录</button></form>
  <div id="message" role="alert"></div><div class="hint">首次管理员请在 API/.env 配置 ADMIN_USERNAME 和 ADMIN_PASSWORD 后重启服务。</div>
</main><script>
const $=s=>document.querySelector(s),message=$('#message');let departmentState='loading';
function mode(view='login'){const register=view==='register',reset=view==='reset';$('#loginForm').hidden=view!=='login';$('#registerForm').hidden=!register;$('#resetForm').hidden=!reset;$('#subtitle').textContent=register?'填写实名信息，注册后即可使用':reset?'核验注册信息后，设置新的登录密码':'请登录后使用公司局域网创作服务';message.textContent='';message.style.color='#ff9b9b';if(register&&departmentState==='empty')message.textContent='管理员尚未设置可注册的部门，请联系管理员。';if((register||reset)&&departmentState==='error')message.textContent='部门加载失败，请刷新页面重试。'}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'请求失败');return d}
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function loadDepartments(){try{const response=await fetch('/api/departments'),data=await response.json();if(!response.ok)throw new Error(data.detail||'部门加载失败');const rows=data.departments||[],enabled=rows.filter(item=>item.enabled);departmentState=enabled.length?'ready':'empty';$('#registerDepartment').innerHTML='<option value="">请选择部门</option>'+enabled.map(item=>`<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}</option>`).join('');$('#resetDepartment').innerHTML='<option value="">请选择注册时的部门</option>'+rows.map(item=>`<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}${item.enabled?'':'（已停用）'}</option>`).join('');$('#registerDepartment').disabled=!enabled.length;$('#registerSubmit').disabled=!enabled.length;$('#resetDepartment').disabled=!rows.length;$('#resetSubmit').disabled=!rows.length}catch(err){departmentState='error';$('#registerDepartment').innerHTML='<option value="">部门加载失败</option>';$('#resetDepartment').innerHTML='<option value="">部门加载失败</option>';$('#registerDepartment').disabled=$('#resetDepartment').disabled=true;$('#registerSubmit').disabled=$('#resetSubmit').disabled=true}}
$('#showRegister').onclick=()=>mode('register');$('#showLogin').onclick=()=>mode();$('#showReset').onclick=()=>mode('reset');$('#showLoginFromReset').onclick=()=>mode();
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',Object.fromEntries(new FormData(e.target)));location.href='/'}catch(err){message.textContent=err.message}};
$('#registerForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/register',Object.fromEntries(new FormData(e.target)));mode();message.style.color='#7ee787';message.textContent='注册成功，请登录。'}catch(err){message.style.color='#ff9b9b';message.textContent=err.message}};
$('#resetForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(data.new_password!==data.confirm_password){message.textContent='两次输入的新密码不一致。';return}delete data.confirm_password;try{await api('/api/auth/reset-password',data);mode();message.style.color='#7ee787';message.textContent='密码已重置，请使用新密码登录。'}catch(err){message.style.color='#ff9b9b';message.textContent=err.message}};
loadDepartments();
</script></body></html>
